spring:
  application:
    name: crypto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crypto}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:crypto}
    driver-class-name: org.postgresql.Driver

  output:
    ansi:
      enabled: always

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /api-docs

app:
  auth:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      # Base64 of a 32-byte development key; override in production.
      secret: ${JWT_SECRET:Y3J5cHRvLXNwcmluZy1qd3Qtc2VjcmV0LWxvY2FsMDE=}
      issuer: ${JWT_ISSUER:https://crypto-api.local}
      audience: ${JWT_AUDIENCE:crypto-web}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

trading:
  max-price-age: ${TRADING_MAX_PRICE_AGE:PT5S}
  maintenance-margin-rate: ${TRADING_MAINTENANCE_MARGIN_RATE:0.005}
  default-max-slippage-bps: ${TRADING_DEFAULT_MAX_SLIPPAGE_BPS:5}
