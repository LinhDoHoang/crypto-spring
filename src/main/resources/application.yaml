spring:
  application:
    name: crypto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crypto?TimeZone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:crypto}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 200ms
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1s

  output:
    ansi:
      enabled: always

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

server:
  servlet:
    context-path: /api/v1

app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX}
  auth:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
    jwt:
      # Base64 of a 32-byte development key; override in production.
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE:crypto-web}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL}
    cookie:
      secure: ${AUTH_COOKIE_SECURE}
      same-site: ${AUTH_COOKIE_SAME_SITE}

springdoc:
  api-docs:
    path: /api-docs

trading:
  max-price-age: ${TRADING_MAX_PRICE_AGE:PT5S}
  maintenance-margin-rate: ${TRADING_MAINTENANCE_MARGIN_RATE:0.005}
  default-max-slippage-bps: ${TRADING_DEFAULT_MAX_SLIPPAGE_BPS:5}
