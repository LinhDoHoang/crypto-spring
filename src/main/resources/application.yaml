spring:
  application:
    name: crypto

  datasource:
    url: jdbc:postgresql://localhost:5433/crypto
    username: postgres
    password: crypto
    driver-class-name: org.postgresql.Driver

  output:
    ansi:
      enabled: always

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /api-docs
