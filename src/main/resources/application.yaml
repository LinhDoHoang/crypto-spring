spring:
  application:
    name: crypto

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/crypto}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:crypto}
    driver-class-name: org.postgresql.Driver

  output:
    ansi:
      enabled: always

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: /api/v1

springdoc:
  api-docs:
    path: /api-docs
